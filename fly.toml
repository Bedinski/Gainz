app = "gainz"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  SQLITE_PATH = "/data/gainz.db"
  CLAUDE_AUTH_DIR = "/data/claude-auth"

[mounts]
  source = "gainz_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
